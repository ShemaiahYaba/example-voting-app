name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: shemaiahyaba

jobs:
  test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for vote and result
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ >/dev/null \
              && curl -sf http://localhost:8081/ >/dev/null; then
              echo "vote and result are up"
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

  build:
    name: Build ${{ matrix.app }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: vote
            context: ./vote
          - app: result
            context: ./result
          - app: worker
            context: ./worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/example-voting-app-${{ matrix.app }}"
          SHA_TAG="${{ github.sha }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${IMAGE}:${SHA_TAG},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Push to GHCR
        if: steps.meta.outputs.push == 'true'
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}"
          docker push "${{ steps.meta.outputs.image }}:latest"

      - name: Make package public
        if: steps.meta.outputs.push == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="example-voting-app-${{ matrix.app }}"
          gh api --method PUT \
            "/user/packages/container/${PKG}/visibility" \
            -f visibility=public || true

  deploy:
    name: Helm deploy to EKS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name voting-app --region "${{ secrets.AWS_REGION }}"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm upgrade --install
        run: |
          helm upgrade --install voting-app ./charts/voting-app \
            --namespace voting-app \
            --create-namespace \
            --set vote.image.tag="${{ github.sha }}" \
            --set result.image.tag="${{ github.sha }}" \
            --set worker.image.tag="${{ github.sha }}" \
            --wait \
            --timeout 5m

      - name: Show release status
        run: |
          helm status voting-app -n voting-app
          kubectl get pods,svc -n voting-app
